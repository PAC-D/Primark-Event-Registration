<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primark Carton Nomination Program</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#002b61">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/css/tom-select.default.min.css" integrity="sha384-SHsvLe/18AiQC30hXizNPI6L6QhI2ckZ3g0cKEhAz+ZT9Pg/xvgXAnbsGRsWSI6V" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/js/tom-select.complete.min.js" integrity="sha384-1mYKSrq1Nu5YJmWrIU9cvwWQlUyyukJJM9XMkAxY03nb/T69CK+Sn7rjFxVU3SSM" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/register.js"></script>
</head>
<body>
  <header class="brand-band">
    <div class="brand-inner anim-rise">
      <span class="logo-chip"><img class="brand-logo pacd" src="/brand/pacd.png" alt="PacD" width="458" height="154"></span>
      <div class="brand-title">
        <h1>Primark Carton Nomination Program</h1>
        <p class="brand-sub" id="event-subtitle"></p>
      </div>
      <img class="brand-logo primark" src="/brand/primark.png" alt="Primark" width="2285" height="311">
    </div>
  </header>
  <main class="page">
    <div class="event-details anim-rise" style="--i: 1">
      <dl>
        <div><dt>Date</dt><dd>Nov 04, 2026</dd></div>
        <div><dt>Time</dt><dd>9:30 AM – 4:30 PM (GMT+6)</dd></div>
        <div><dt>Event Type</dt><dd>Face-to-Face</dd></div>
      </dl>
    </div>
    <p class="details-note muted anim-rise" style="--i: 1">Fields marked <span class="req">*</span> are required. Up to 2 people from each supplier and 1 person from each factory can attend.</p>
    <div id="app" class="card anim-rise" style="--i: 2"><p class="muted">Loading…</p></div>
  </main>
</body>
</html>
